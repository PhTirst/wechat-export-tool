name: Windows portable bundle

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -e ".[dev]" -r requirements-build.txt
      - run: npm ci --ignore-scripts
      - run: python -m pytest -q
      - run: python scripts/check_public_tree.py
      - name: Build the pinned capture backend
        run: .\scripts\build_capture.ps1
      - name: Prepare checksum-pinned runtimes and notices
        run: python scripts/prepare_windows_runtime.py
      - name: Build GUI and CLI portable executables
        run: .\scripts\build_windows.ps1
      - name: Exercise encrypted synthetic chats with external runtimes removed from PATH
        run: python scripts/smoke_windows_bundle.py --bundle dist/windows/WeChatExportTool --report dist/windows/smoke-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-portable
          path: |
            dist/windows/WeChatExportTool-*.zip
            dist/windows/SHA256SUMS.txt
            dist/windows/smoke-report.json
          if-no-files-found: error
          retention-days: 14
